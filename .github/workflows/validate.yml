name: Validate vendor assurance lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify assessment and historical evidence rules
        run: python -m unittest discover -s tests -v
      - name: Verify checked-in reader source hashes before rebuilding
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('site/review/source-manifest.json').read_text())
          for item in manifest['sources']:
              actual = hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()
              assert actual == item['sha256'], item['path']
          print(f"Verified {len(manifest['sources'])} published source hashes")
          PY
      - name: Validate recorded native framework readback
        run: python scripts/validate_framework_snapshot.py
      - name: Install the static report renderer
        run: python -m pip install -r requirements-build.txt
      - name: Reproduce synthetic assessment and publication
        run: |
          python assessment.py
          python scripts/build_scorecard.py
          python -c "import json; from pathlib import Path; result = json.loads(Path('output/outcome_scorecard.json').read_text()); assert result['platform_roundtrip']['status'] == 'verified', result['platform_roundtrip']"
          python build_site.py
